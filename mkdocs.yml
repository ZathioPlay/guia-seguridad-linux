site_name: Guía Técnica de Git y Control de Versiones
site_author: Daniel Pérez y Pedro Smith
site_description: Manual práctico de instalación, flujo de trabajo colaborativo y comandos esenciales de Git.ux.

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Inicio: index.md
  - Introducción: introduccion.md
  - Instalación y Requisitos: instalacion.md
  - Uso y Funcionamiento: uso.md
  - Conclusiones: conclusiones.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
